    * { box-sizing: border-box; margin: 0; padding: 0; }

    .notfound {
      max-width: 640px;
      margin: 0 auto;
      padding: 96px 24px 120px;
      text-align: center;
    }
    .notfound-code {
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -2px;
      color: var(--indigo);
      margin-bottom: 12px;
    }
    .notfound h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
      margin-bottom: 10px;
    }
    .notfound p {
      font-size: 14px;
      color: var(--text2);
      margin-bottom: 36px;
      line-height: 1.8;
    }
    .notfound-links {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: var(--text);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      padding: 12px 26px;
      border-radius: 14px;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-primary:hover { opacity: 0.8; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      background: var(--bg2);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      padding: 12px 26px;
      border-radius: 14px;
      text-decoration: none;
      border: 0.5px solid var(--border);
      transition: background 0.15s, transform 0.1s;
    }
    .btn-secondary:hover { background: var(--border); }
    .btn-secondary:active { transform: scale(0.98); }
    footer { padding: 28px 24px; }
  </style>
</head>
