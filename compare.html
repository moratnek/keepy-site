<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>画像処理の比較（検証用）</title>
<link rel="stylesheet" href="keepy.css?v=3">
<style>
  body { padding: 40px 24px; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { color: #8C8880; font-size: 14px; margin-bottom: 28px; }
  .row { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; }
  .cell { text-align: center; }
  .cell .label { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
  .cell img { width: 211px; height: auto; display: block; border-radius: 25px; }
  .cell .phone { margin: 0 auto; }
</style>
</head>
<body>
  <h1>スクショ表示の比較（検証用・非公開ページ）</h1>
  <p>同じ画面を5つの処理方式で表示しています。いちばん文字が見やすいものの記号を教えてください。並び順に意味はありません。</p>
  <div class="row">
    <div class="cell"><div class="label">A</div><div class="phone"><img src="images/compare/a.png" alt="方式A"></div></div>
    <div class="cell"><div class="label">B</div><div class="phone"><img src="images/compare/b.png" alt="方式B"></div></div>
    <div class="cell"><div class="label">C</div><div class="phone"><img src="images/compare/c.png" alt="方式C"></div></div>
    <div class="cell"><div class="label">D</div><div class="phone"><img src="images/compare/d.png" alt="方式D"></div></div>
    <div class="cell"><div class="label">E</div><div class="phone"><img src="images/compare/e.png" alt="方式E"></div></div>
  </div>
</body>
</html>
